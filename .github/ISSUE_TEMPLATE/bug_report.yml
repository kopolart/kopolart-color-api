name: Bug report
description: Report an API error, incorrect data or a documentation mistake
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include the exact request so the response
        can be reproduced. For security issues, use SECURITY.md instead.
  - type: input
    id: endpoint
    attributes:
      label: Request URL
      description: The full URL you called.
      placeholder: https://kopolart.ir/api/color/ff0000
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client
      description: Language, library or tool used.
      placeholder: Node.js 22 / fetch
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the HTTP status code and response body.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the documentation and this is not explained behavior.
          required: true
        - label: This is not a security vulnerability.
          required: true
