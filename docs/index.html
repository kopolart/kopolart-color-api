<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kopolart Color API — Reference</title>
  <meta name="description" content="Interactive reference for the free Kopolart Color API: color profiles, complements, similar colors and palettes.">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; }
    #redoc-container { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="redoc-container"></div>
  <!-- Redoc is vendored for offline use; see redoc.LICENSE. -->
  <script src="./redoc.standalone.js"></script>
  <script>
    Redoc.init(
      "../openapi.yaml",
      {
        theme: {
          colors: {
            primary: { main: "#6366f1" },
            success: { main: "#16a34a" },
            warning: { main: "#d97706" },
            error: { main: "#dc2626" }
          },
          typography: {
            fontFamily: "Inter, 'Segoe UI', system-ui, -apple-system, sans-serif",
            code: { fontFamily: "'JetBrains Mono', 'Cascadia Code', Consolas, monospace" }
          },
          sidebar: { backgroundColor: "#0b1020", textColor: "#cbd5e1" }
        },
        expandResponses: "200",
        pathInMiddlePanel: true,
        hideDownloadButton: false,
        jsonSampleExpandLevel: 3
      },
      document.getElementById("redoc-container")
    );
  </script>
</body>
</html>
